services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: knowyourrights-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORPUS_VERSION
        value: "1"

  # 2. Next.js Frontend Web Service
  - type: web
    name: knowyourrights-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SHOW_DEBUG
        value: "false"

  # 3. Render Cron Job (Secondary Keep-Alive Ping every 10 mins)
  - type: cron
    name: knowyourrights-keepalive-cron
    env: python
    rootDir: backend
    schedule: "*/10 * * * *"
    buildCommand: pip install requests
    startCommand: python -c "import os, requests; url = os.getenv('RENDER_EXTERNAL_URL', 'https://knowyourrights-backend.onrender.com/'); requests.get(url)"