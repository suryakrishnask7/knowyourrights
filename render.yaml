services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: knowyourrights-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORPUS_VERSION
        value: "1"

  # 2. Next.js Frontend Web Service
  - type: web
    name: knowyourrights-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SHOW_DEBUG
        value: "false"